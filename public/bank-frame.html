<!doctype html><html lang="en" data-version="1.0"><head><meta charset="utf-8"><title>Core banking training surface</title><style>*{box-sizing:border-box}body{font:14px 'Avenir Next','Segoe UI',sans-serif;color:#253951;margin:0;padding:26px;background:#f8fafc}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe3ec;padding-bottom:20px}header b{font-size:13px;letter-spacing:1.5px;color:#245873}header small{font-size:10px;color:#8996a8}h1{font-size:21px;margin:28px 0 8px}p{font-size:13px;color:#7b889a;line-height:1.6}table{border-collapse:collapse;width:100%;margin:20px 0}td{padding:12px 7px;border-bottom:1px solid #e3e8ef;font-size:13px}td:first-child{color:#667b91;width:40%}input{padding:10px;border:1px solid #cbd6e3;border-radius:4px;width:100%;font:inherit}button{background:#245873;color:white;border:0;border-radius:4px;padding:10px 15px;font:inherit;font-size:12px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #6895ff;outline-offset:2px}footer{font-size:10px;color:#9aa5b4;margin-top:35px}.alert{padding:16px;background:#fff4de;color:#856212;border:1px solid #f2dda5;margin:18px 0}.success{color:#197255}.muted{background:#e9eff6;color:#526982}</style></head><body><header><b id="brand">NORTHSTAR / CORE</b><small>Training session · v1.0</small></header><div id="screen"></div><footer>Synthetic data only. No real accounts or transactions.</footer><script>
const q=new URLSearchParams(location.search),tenant=q.get('tenant')||'northstar',scenario=q.get('scenario')||'normal';let current='',interrupted=false,retried=false;
if(tenant==='harbor'){document.querySelector('#brand').textContent='HARBOR / OPERATIONS';document.documentElement.dataset.version='1.1';}
const screen=document.querySelector('#screen');
const records={'12345':{label:'Demo member A',balance:'USD 4,280.50'},'67890':{label:'Demo member B',balance:'USD 9,615.25'},'24680':{label:'Demo member C',balance:'USD 125.00'}};
function search(){screen.innerHTML='<h1>Member services</h1><p>Find a member and review their accounts.</p><table><tr><td>Member ID</td><td><input aria-label="Member ID" inputmode="numeric" autocomplete="off"></td></tr></table><button>'+ (tenant==='harbor'?'Find member':'Search members')+'</button>';screen.querySelector('button').onclick=()=>{current=screen.querySelector('input').value;lookup();};}
function lookup(){if(!/^\d{5}$/.test(current)){screen.insertAdjacentHTML('beforeend','<p role="alert">Validation error: use a five-digit member ID.</p>');return;}
 if(scenario==='permission'){screen.innerHTML='<h1>Permission denied</h1><p>This training operator cannot access member records.</p>';return;}
 if(scenario==='slow'){screen.innerHTML='<p>Loading member records…</p>';setTimeout(result,1100);return;}
 if(scenario==='transient'&&!retried){screen.innerHTML='<h1>Temporary connection error</h1><button>Retry load</button>';screen.querySelector('button').onclick=()=>{retried=true;result()};return;}
 if(scenario==='dialog'&&!retried){screen.innerHTML='<h1>Service notice</h1><p>Scheduled maintenance later today.</p><button>Dismiss notice</button>';screen.querySelector('button').onclick=()=>{retried=true;result()};return;}
 if((scenario==='handoff'||scenario==='recovery')&&!interrupted){screen.innerHTML='<h1>Session expired</h1><p>Restore this training session to continue the current lookup.</p><button>Restore session</button>';screen.querySelector('button').onclick=()=>{interrupted=true;result()};return;}
 if(scenario==='unknown'){screen.innerHTML='<h1>Unexpected application error</h1><p>The application cannot continue.</p>';return;}result();}
function result(){if(!records[current]){screen.innerHTML='<h1>Member not found</h1><p>No matching record exists.</p>';return;}screen.innerHTML='<h1>Member search results</h1><table><tr><td>Member ID</td><td data-sensitive></td></tr><tr><td>Record</td><td>Demo member</td></tr></table><button>Open member</button>';screen.querySelector('[data-sensitive]').textContent=current;screen.querySelector('button').onclick=detail;}
function detail(){screen.innerHTML='<h1>Member detail</h1><p>Select an account to inspect its current balance.</p><table><tr><td>Member ID</td><td data-sensitive></td></tr><tr><td>Account type</td><td>Savings</td></tr></table><button>Savings account</button>';screen.querySelector('[data-sensitive]').textContent=current;screen.querySelector('button').onclick=account;}
function account(){screen.innerHTML='<h1>Account overview</h1><p class="success">Account available · Savings</p><table><tr><td>Member ID</td><td data-sensitive></td></tr><tr><td>Savings balance</td><td data-sensitive></td></tr></table><button class="muted">Back to search</button> <button>Submit transfer</button>';const v=screen.querySelectorAll('[data-sensitive]');v[0].textContent=current;v[1].textContent=records[current].balance;screen.querySelectorAll('button')[0].onclick=search;screen.querySelectorAll('button')[1].onclick=()=>{screen.innerHTML='<h1>Transfer submitted</h1><p>Synthetic action only.</p>'};}
search();if(scenario==='ambiguous')screen.appendChild(screen.querySelector('button').cloneNode(true));
</script></body></html>
